[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI の Depends()/File() を引数の既定値に書く標準的な書き方
    "E501",  # 長さは ruff format に任せる（コメント・日本語の文字列は折り返さない）
    "B905",  # zip(strict=) を足すと長さ違いで例外になり動作が変わる
]

[tool.ruff.lint.per-file-ignores]
# テストは他ファイルから fixture(env) を import して引数で受ける。pytest の標準的な使い方なので F811 を外す
"tests/*" = ["F811"]
